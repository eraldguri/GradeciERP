services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gradeci-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TiranaBruxelles123@"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$MSSQL_SA_PASSWORD -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    container_name: gradeci-webapi
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=CompanySharedDb;User Id=sa;Password=TiranaBruxelles123@;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=True;"
    ports:
      - "8088:5088"

volumes:
  mssql_data: